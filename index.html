<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PBS 컬러강점 어린이 · 결과 입력</title>
<style>
:root{
  --red:#FF3366;--red-bg:#FFF0F4;--yellow:#F5A623;--yellow-bg:#FFF8E6;
  --green:#00A878;--green-bg:#E6F8F1;--blue:#0077B6;--blue-bg:#E6F4FB;
  --purple:#9B59B6;--purple-bg:#F5EEFA;
  --ink:#2A2540;--soft:#6B6584;--muted:#9A94AE;--line:#ECE8F5;
  --bg:#FBFAFE;--surface:#fff;--r:18px;
  --brand:linear-gradient(135deg,#7C4DBE,#B36BE0);
  --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:580px;margin:0 auto;padding:0 16px 60px}
.top{background:var(--brand);color:#fff;border-radius:0 0 26px 26px;padding:26px 20px 30px;text-align:center}
.top .rainbow{font-size:40px;line-height:1}
.top h1{font-size:22px;font-weight:900;margin-top:6px;letter-spacing:-.02em}
.top p{font-size:13.5px;opacity:.95;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;margin:14px 0;box-shadow:0 4px 14px rgba(80,60,140,.06)}
.card h2{font-size:19px;font-weight:900;margin-bottom:6px}
.card .sub{color:var(--soft);font-size:14px;margin-bottom:14px}
.screen{display:none}.screen.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.score-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px;margin-bottom:10px}
.score-row .emo{font-size:34px;line-height:1;width:44px;text-align:center;flex-shrink:0}
.score-row .lab{flex:1}.score-row .lab b{display:block;font-size:16px;font-weight:900}
.score-row .lab span{font-size:12px;color:var(--soft);font-weight:700}
.score-row input{width:78px;height:52px;text-align:center;font-size:22px;font-weight:900;font-family:var(--font);border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.score-row input:focus{outline:none}
.score-row[data-c="RED"]{background:var(--red-bg)} .score-row[data-c="RED"] input:focus{border-color:var(--red)} .score-row[data-c="RED"] .lab b{color:var(--red)}
.score-row[data-c="YELLOW"]{background:var(--yellow-bg)} .score-row[data-c="YELLOW"] input:focus{border-color:var(--yellow)} .score-row[data-c="YELLOW"] .lab b{color:#C9821A}
.score-row[data-c="GREEN"]{background:var(--green-bg)} .score-row[data-c="GREEN"] input:focus{border-color:var(--green)} .score-row[data-c="GREEN"] .lab b{color:var(--green)}
.score-row[data-c="BLUE"]{background:var(--blue-bg)} .score-row[data-c="BLUE"] input:focus{border-color:var(--blue)} .score-row[data-c="BLUE"] .lab b{color:var(--blue)}
.score-row[data-c="PURPLE"]{background:var(--purple-bg)} .score-row[data-c="PURPLE"] input:focus{border-color:var(--purple)} .score-row[data-c="PURPLE"] .lab b{color:var(--purple)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 12px}
.btn{display:block;width:100%;border:none;border-radius:999px;padding:17px;font-size:17px;font-weight:900;font-family:var(--font);cursor:pointer;color:#fff;background:var(--brand);box-shadow:0 8px 20px rgba(124,77,190,.32);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:#7C4DBE;border:2px solid #E4D5F3;box-shadow:none}
.remain{text-align:center;font-size:13px;color:var(--soft);font-weight:700;margin-top:10px}
.hero{border-radius:22px;padding:30px 20px;text-align:center;color:#fff}
.hero .emo{font-size:76px;line-height:1}
.hero .kicker{font-size:13px;font-weight:800;opacity:.9;letter-spacing:.08em;margin-top:6px}
.hero h2{font-size:28px;font-weight:900;margin:2px 0 4px}
.hero .head{font-size:15px;font-weight:700;opacity:.97;max-width:430px;margin:8px auto 0}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0}
.bar .bemo{font-size:22px;width:30px;text-align:center}
.bar .bt{flex:1}
.bar .bt .n{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:3px}
.bar .track{height:12px;background:#F0ECF8;border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px}
.sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sec:first-child{border-top:none;padding-top:0;margin-top:0}
.sec h3{font-size:16.5px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.sec p{font-size:14.5px;color:#3a3550;line-height:1.85;margin-bottom:8px}
.sec p:last-child{margin-bottom:0}
.sec ul{list-style:none}
.sec li{font-size:14.5px;color:#3a3550;padding:5px 0 5px 24px;position:relative;line-height:1.65}
.sec li::before{content:"⭐";position:absolute;left:0;font-size:13px;top:6px}
.tip{background:#EFFAF4;border-left:3px solid var(--green);border-radius:8px;padding:10px 13px;font-size:13.8px;color:#2f5f4c;line-height:1.75}
.care{background:#FFF4F6;border-left:3px solid var(--red);border-radius:8px;padding:10px 13px;font-size:13.8px;color:#7a3a48;line-height:1.75}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chips span{background:#F4F0FB;color:#6A4A9A;font-size:13.5px;font-weight:800;padding:8px 14px;border-radius:999px}
.chips.job span{background:#EAF6FF;color:#0F5E8C}
.models{font-size:13.5px;color:var(--soft);font-weight:700;margin-top:10px}.models b{color:var(--ink)}
.affirm{background:var(--purple-bg);border-radius:14px;padding:16px;text-align:center;font-size:16.5px;font-weight:800;color:#6A4A9A;margin-top:16px}
.guide{background:#FFF8E6;border:1px dashed #F0C86A;border-radius:14px;padding:15px 16px;margin-top:16px}
.guide b{color:#B5820F}.guide p{font-size:14px;color:#5b5330;line-height:1.8;margin-top:4px}
.basis{background:#F4F2FA;border-radius:12px;padding:13px 15px;margin-top:12px;font-size:12.8px;color:var(--soft);line-height:1.75}.basis b{color:#5A5470}
.field{margin-bottom:14px}
.field label{display:block;font-size:14.5px;font-weight:800;margin-bottom:7px}
.field textarea{width:100%;min-height:96px;font-family:var(--font);font-size:15px;padding:12px;border:2px solid var(--line);border-radius:12px;resize:vertical}
.field textarea:focus{outline:none;border-color:#B36BE0}
.stars{font-size:38px;letter-spacing:6px;cursor:pointer;user-select:none;text-align:center}
.stars span{color:#E3DFF0}
#imgprev img{max-width:100%;max-height:220px;border-radius:12px;margin-top:8px;border:1px solid var(--line)}
.more{background:linear-gradient(135deg,#2C1338,#7030A0);color:#fff;border-radius:20px;padding:24px 20px;margin-top:16px;text-align:center}
.more .k{font-size:12px;font-weight:800;opacity:.85;letter-spacing:.15em;margin-bottom:8px}
.more h3{font-size:19px;font-weight:900;margin-bottom:6px}
.more p{font-size:13.5px;opacity:.95;line-height:1.65;margin-bottom:14px}
.more a{display:block;text-decoration:none;font-weight:900;font-size:14.5px;padding:14px;border-radius:12px;margin-top:9px}
.more a.p{background:#FFD56B;color:#4A1F6B}.more a.o{background:transparent;color:#fff;border:1.6px solid rgba(255,255,255,.55)}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:22px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2A2540;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.toast.on{opacity:1}
.print-only{display:none}
@media print{ body{background:#fff}.no-print{display:none!important}.print-only{display:block!important}
  .wrap{max-width:100%;padding:0}.card{box-shadow:none;border:1px solid #e5e0f0;break-inside:avoid;margin:6px 0}
  .hero,.bar .fill,.chips span,.more,.affirm,.guide,.tip,.care{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:12mm} }
</style>
</head>
<body>
<div class="top">
  <div class="rainbow">🌈</div>
  <h1>나의 컬러강점 결과 보기</h1>
  <p>종이 진단지의 <b>색깔별 점수</b>를 넣으면<br>나의 컬러 친구와 자세한 설명이 나와요!</p>
</div>
<div class="wrap">
  <section id="s-input" class="screen active no-print">
    <div class="card">
      <h2>✏️ 색깔별 점수를 넣어봐요</h2>
      <p class="sub">종이 진단지에서 색깔마다 더한 점수(보통 5~25점)를 그대로 적어요. 하나 넣으면 자동으로 다음 칸으로 넘어가요.</p>
      <div id="score-list"></div>
      <div class="remain" id="remain">5개 색깔 점수를 모두 넣어주세요</div>
    </div>
    <button class="btn" onclick="showResult()">🎉 결과 보기</button>
    <p class="hint">정답은 없어요. 종이에 적은 점수를 그대로 넣으면 돼요 😊</p>
  </section>
  <section id="s-result" class="screen"></section>
</div>
<div class="toast" id="toast"></div>
<script>
const ORDER=['RED','YELLOW','GREEN','BLUE','PURPLE'];
const CHILD={
  RED:{emo:'🦁',animal:'용감한 사자',color:'빨강',hex:'#FF3366',role:'씩씩한 추진',
    head:'새로운 일에 가장 먼저 뛰어드는 용감한 대장! 도전과 리더십의 에너지를 타고났어요.',
    strengths:['하고 싶은 일을 망설이지 않고 바로 시작하는 실행력이 있어요','어려운 일도 포기하지 않고 끝까지 도전해요','친구들을 이끌고 결정을 내리는 리더의 힘이 있어요','목표를 향해 힘차게 나아가는 에너지가 넘쳐요','낯설고 새로운 일도 두려워하지 않고 먼저 나서요','경쟁이나 어려움을 만나면 오히려 더 힘이 솟아요'],
    interests:['축구·태권도 같은 운동','반장·모둠장 리더 역할','도전 대회·미션','목표 세우고 이뤄가기','캠핑·모험·탐험 놀이','발표·토론에서 앞장서기'],
    motiv:'새로운 도전을 성공했을 때, 남들이 어려워하는 일을 해냈을 때, 팀을 이끌어 이겼을 때 가장 신나고 힘이 솟아요. "네가 해냈어!"라는 말을 들으면 다음 도전도 겁내지 않고 뛰어들어요.',
    study:'가만히 앉아 외우기보다 몸을 움직이며 직접 해보는 활동형 학습이 잘 맞아요(가드너 신체·운동 지능). 공부를 "오늘의 도전 미션"처럼 목표와 시간을 정해 게임하듯 하면 집중이 확 올라가요.',
    studyTip:'집중 팁: 25분 몰입 + 5분 휴식처럼 짧고 강하게 끊어서 하고, 끝낼 때마다 "미션 클리어!"라고 표시해 주세요. 타이머·점수 같은 도전 요소를 넣으면 더 몰입해요.',
    friend:'친구들에게 먼저 다가가 놀이를 이끄는 리더예요. 내 뜻대로만 하기보다 "너는 어때?" 하고 친구 의견을 끝까지 들어주면 모두가 따르는 진짜 대장이 돼요.',
    care:'조심할 점: 급하게 말하거나 이기려는 마음이 세지면 친구가 서운할 수 있어요. 한 박자 쉬고 부드럽게 말하는 연습을 해봐요.',
    grow:'급한 마음에 실수하거나 지는 걸 힘들어할 때가 있어요. 잠깐 멈춰 생각하기, "지는 것도 배움"이라는 마음을 익히면 강점이 두 배로 단단해져요. 예를 들어 게임에서 졌을 때 "다음엔 이렇게 해볼래" 하고 방법을 찾으면 진짜 강한 사람이 돼요.',
    careerWhy:'앞장서서 이끌고 도전하는 걸 좋아해서, 사람과 상황을 이끌고 목표를 이루는 직업에서 빛나요. 책임감 있게 결정하고 위기에도 앞장서는 힘이 리더의 자질이에요.',
    jobs:['운동선수','팀 리더·CEO','경찰·소방관·군인','탐험가','창업가','스포츠 감독','응급구조사'],
    models:'이순신 장군, 도전하는 운동선수, 극지 탐험가',
    schoolTip:'학교에서 모둠장·1인 1역할을 맡아 책임을 다해보고, "순서 기다리기·친구 먼저 배려하기"를 이번 학기 목표로 삼으면 리더십이 더 멋지게 자라요.',
    guide:'"네가 대장이야!" 같은 역할과 도전 미션을 주면 신나게 몰입해요. 결과보다 "시도한 용기"를 칭찬하고, 기다리기·친구 배려·감정 조절을 함께 알려주면 리더십이 완성됩니다. 넘치는 에너지는 운동·리더 활동으로 건강하게 풀어주세요.',
    basis:'DISC의 주도형(D)·칼 융의 외향적 사고와 연결돼요. 도전을 즐기는 성취 동기가 강점의 뿌리입니다.',
    cheer:'나는 용감하게 도전하는 멋진 사자예요! 🦁'},
  YELLOW:{emo:'🐤',animal:'명랑한 병아리',color:'노랑',hex:'#F5A623',role:'즐거운 친구',
    head:'어디서나 환하게 빛나는 즐거운 친구! 사람과 함께할 때 에너지가 폭발해요.',
    strengths:['밝은 에너지로 주변을 행복하게 만들어요','처음 만난 친구와도 금방 친해져요','재미있는 아이디어와 표현이 톡톡 나와요','발표·무대에서 떨려도 신나게 해내요','분위기를 밝게 바꾸는 힘이 있어요','칭찬과 응원으로 친구에게 힘을 줘요'],
    interests:['발표·역할극·연극','노래·춤·방송 놀이','친구들과 팀 활동·동아리','새로운 사람 만나기','파티·행사 꾸미기','반 이벤트 기획하기'],
    motiv:'친구가 나를 보고 활짝 웃을 때, 사람들 앞에서 박수받을 때, 다 같이 신나게 어울릴 때 가장 행복하고 힘이 나요. 인정과 칭찬을 받으면 더 열심히 하고 싶어져요.',
    study:'혼자 조용히보다 친구와 이야기하며 배우는 함께 공부가 잘 맞아요(가드너 대인 지능, 비고츠키 사회적 학습). 서로 문제를 내고 설명해주는 짝 공부를 하면 즐겁게 오래 집중해요.',
    studyTip:'집중 팁: 스터디 짝꿍을 정하고, 오늘 배운 걸 다른 사람에게 설명해보게 하면 이해가 확 깊어져요. 작은 목표를 이룰 때마다 스티커·칭찬 같은 즐거운 보상을 주면 좋아요.',
    friend:'모두와 잘 어울리는 인기쟁이예요. 조용한 친구에게도 먼저 손 내밀고, 신날 때도 친구 이야기를 끝까지 들어주면 최고의 친구가 돼요.',
    care:'조심할 점: 재미에 빠져 친구 말을 끊거나 산만해질 수 있어요. "지금은 들을 시간"을 정해두면 대화가 더 즐거워져요.',
    grow:'재미를 좇다 시작한 일을 끝까지 못 맺을 때가 있어요. "끝맺는 즐거움"을 경험하면 밝은 에너지가 멋진 결실로 이어져요. 할 일을 작게 쪼개고 하나씩 지울 때마다 스스로 칭찬해 주세요.',
    careerWhy:'사람들과 소통하고 분위기를 밝히는 걸 좋아해서, 표현하고 사람을 만나는 직업에서 빛나요. 밝은 에너지와 공감으로 사람의 마음을 여는 힘이 강점이에요.',
    jobs:['방송인·유튜버','가수·배우','선생님','승무원·서비스','이벤트·홍보 기획자','아나운서·MC','상담·코치'],
    models:'유쾌한 방송인, 좋아하는 가수, 인기 선생님',
    schoolTip:'발표·사회·응원단처럼 사람 앞에 서는 역할을 맡아보고, "한 가지 일을 끝까지 마무리하기"를 목표로 삼으면 에너지가 결과로 이어져요.',
    guide:'많이 칭찬하고 발표·역할극 무대를 자주 주면 활짝 피어나요. 혼자 집중해야 할 땐 짝꿍과 함께하는 방식을, 끝까지 마무리하는 습관과 경청하는 태도를 함께 길러주세요.',
    basis:'DISC의 사교형(I)·Big5 외향성과 연결돼요. 사람 속에서 에너지를 얻는 기질이 강점입니다.',
    cheer:'나는 모두를 웃게 하는 반짝이는 병아리예요! 🐤'},

(function buildInputs(){
  document.getElementById('score-list').innerHTML=ORDER.map(c=>{ const d=CHILD[c];
    return `<div class="score-row" data-c="${c}"><div class="emo">${d.emo}</div>
      <div class="lab"><b>${d.color} · ${d.animal}</b><span>${d.role}</span></div>
      <input id="sc-${c}" type="number" min="0" max="25" inputmode="numeric" enterkeyhint="next" placeholder="0~25"
        oninput="onScoreInput(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();scoreNext(this);}"></div>`;}).join('');
})();
function scoreInputs(){ return ORDER.map(c=>document.getElementById('sc-'+c)); }
function scoreNext(el){ const a=scoreInputs(),i=a.indexOf(el);
  if(i>-1&&i<a.length-1){const n=a[i+1];n.focus();try{n.select();}catch(e){}} else if(i===a.length-1){el.blur();} }
function onScoreInput(el){ let v=el.value.replace(/[^0-9]/g,'').slice(0,2); if(v!==el.value)el.value=v;
  updateRemain(); const n=parseInt(v,10); if(v.length>=2||(v.length===1&&n>=3)) scoreNext(el); }
function updateRemain(){ let n=0; scoreInputs().forEach(el=>{if(el.value!==''&&!isNaN(parseInt(el.value)))n++;});
  document.getElementById('remain').textContent = n<5?`${5-n}개 색깔 점수가 남았어요 (${n}/5)`:'모두 입력 완료! 결과를 볼 수 있어요 🎉'; }

let LAST=null,_star=0,_fbImg=null;
function showResult(){
  const scores={}; let miss=null;
  for(const c of ORDER){ const el=document.getElementById('sc-'+c),v=parseInt(el.value,10);
    if(el.value===''||isNaN(v)){ if(!miss)miss=el; scores[c]=0; } else scores[c]=v; }
  if(miss){ toast('5개 색깔 점수를 모두 넣어주세요'); miss.focus(); return; }
  const ranked=[...ORDER].sort((a,b)=>scores[b]-scores[a]), top=ranked[0], d=CHILD[top];
  const max=Math.max(...ORDER.map(c=>scores[c]),1); LAST={scores,ranked,top};
  const bars=ranked.map(c=>{ const s=scores[c],pct=Math.round(s/max*100);
    return `<div class="bar"><div class="bemo">${CHILD[c].emo}</div><div class="bt">
      <div class="n"><span>${CHILD[c].color} · ${CHILD[c].animal}</span><span>${s}점</span></div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${CHILD[c].hex}"></div></div></div></div>`;}).join('');
  document.getElementById('s-result').innerHTML=`
    <div class="hero" style="background:linear-gradient(150deg,${d.hex},${shade(d.hex)})">
      <div class="emo">${d.emo}</div><div class="kicker">나의 대표 컬러 친구</div>

    <div class="card">
      <div class="sec"><h3>🌟 나의 빛나는 강점</h3><ul>${d.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div>

      <div class="field"><label>💬 새롭게 알게 된 점·느낀 점</label>
        <textarea id="fb" placeholder="예: 내가 왜 그런지 알게 됐어요! OO가 특히 좋았어요 :)"></textarea></div>
      <div class="field"><label>📷 사진 첨부 <span style="color:var(--muted);font-weight:600">(선택 · PDF에 함께 담겨요)</span></label>
        <input type="file" accept="image/*" onchange="pickImg(this)"><div id="imgprev"></div></div>
      <button class="btn" onclick="savePDF()">📄 소감 남기고 결과 PDF 받기</button>
      <p class="hint">버튼을 누르면 인쇄 창이 열려요. "PDF로 저장"을 고르면 돼요.</p>
    </div>
    <div class="print-only" id="print-fb"></div>
    <div class="more no-print">
      <div class="k">👨‍👩‍👧 FOR PARENTS</div>
      <h3>더 자세히 알고 싶다면</h3>
      <p>우리 아이 강점을 더 깊이 알고 싶거나, 부모님·어른의 강점도 궁금하다면 아래에서 이어가 보세요.</p>
      <!-- ▼ 링크는 확정 후 교체하세요 ▼ -->
      <a class="p" href="https://pbscolor-6.vercel.app" target="_blank" rel="noopener">🔎 더 상세한 60문항 진단 받기</a>
      <a class="o" href="https://pbs-child-global.vercel.app/06_부모진단.html" target="_blank" rel="noopener">🪞 부모님 진단 받기</a>
      <a class="o" href="https://www.pbscolor.com" target="_blank" rel="noopener">🎨 최해숙 컬러강점 · 프로그램 보기</a>
    </div>
    <button class="btn ghost no-print" style="margin-top:14px" onclick="restart()">↺ 점수 다시 입력하기</button>
    <div class="foot">PBS 컬러강점 어린이 · 5색 컬러 친구 진단<br>본 진단은 자기 이해를 돕는 참고 도구이며, 아이를 규정하는 라벨이 아니라 대화의 출발점으로 사용해주세요.</div>`;
  document.getElementById('s-input').classList.remove('active');
  document.getElementById('s-result').classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function shade(hex){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r*.72);g=Math.round(g*.72);b=Math.round(b*.72);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
function setStar(n){ _star=n; document.querySelectorAll('#stars span').forEach(s=>{s.style.color=(+s.dataset.n<=n)?'#F5A623':'#E3DFF0';}); }
function pickImg(input){ const f=input.files&&input.files[0]; if(!f)return; const img=new Image(),rd=new FileReader();
  rd.onload=e=>{img.onload=()=>{ const max=900; let w=img.width,h=img.height;
    if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    _fbImg=c.toDataURL('image/jpeg',.75); document.getElementById('imgprev').innerHTML=`<img src="${_fbImg}">`;
  };img.src=e.target.result;}; rd.readAsDataURL(f); }
function savePDF(){ const fb=(document.getElementById('fb').value||'').trim(), pf=document.getElementById('print-fb'), d=CHILD[LAST.top];
  pf.innerHTML=`<div class="card"><h2>💜 나의 소감</h2>
    <p style="font-size:13px;color:#6B6584">별점: ${'★'.repeat(_star||0)}${'☆'.repeat(5-(_star||0))}</p>
    ${fb?`<p style="margin-top:6px;font-size:15px">${esc(fb)}</p>`:''}
    ${_fbImg?`<img src="${_fbImg}" style="max-width:100%;max-height:300px;border-radius:12px;margin-top:8px">`:''}
    <p style="margin-top:10px;font-size:13px;color:#9A94AE">PBS 컬러강점 어린이 · 나의 컬러 친구는 ${d.emo} ${d.animal}!</p></div>`;
  toast('결과지를 PDF로 저장해요 📄'); setTimeout(()=>window.print(),350); }
function esc(s){ return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function restart(){ document.getElementById('s-result').classList.remove('active');
  document.getElementById('s-input').classList.add('active');
  scoreInputs().forEach(el=>el.value='');_star=0;_fbImg=null;updateRemain();
  window.scrollTo({top:0,behavior:'smooth'}); }
let _tt; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('on'),2200); }
</script>
